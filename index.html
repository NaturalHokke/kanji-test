<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漢字テスト作成（縦書き）</title>
    <!-- BIZ UDPMincho = UD明朝のオープン版。ローカルに UD 明朝 があれば優先 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPMincho&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-print: "UD Mincho", "BIZ UDPMincho", "Yu Mincho", "Hiragino Mincho ProN", "MS Mincho", serif;
            --font-ui: "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif;
            --box-border: 1.5px solid #111;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: var(--font-ui);
            background: #f0f2f5;
            color: #222;
        }

        /* ===== 編集パネル（画面のみ） ===== */
        .editor {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 0;
            min-height: 100vh;
        }

        .sidebar {
            background: #fff;
            border-right: 1px solid #ddd;
            padding: 16px;
            overflow-y: auto;
            max-height: 100vh;
            position: sticky;
            top: 0;
        }

        .sidebar h1 {
            font-size: 1.1rem;
            margin: 0 0 12px;
            border-bottom: 2px solid #333;
            padding-bottom: 8px;
        }

        .sidebar label {
            display: block;
            font-size: 0.78rem;
            color: #555;
            margin: 10px 0 4px;
        }

        .sidebar input[type="text"],
        .sidebar select,
        .sidebar textarea {
            width: 100%;
            font-family: var(--font-ui);
            font-size: 0.9rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 6px 8px;
        }

        .sidebar textarea {
            height: 280px;
            resize: vertical;
            line-height: 1.5;
        }

        .row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 12px;
        }

        button {
            font-family: var(--font-ui);
            font-size: 0.85rem;
            padding: 7px 12px;
            border: 1px solid #888;
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
        }

        button.primary {
            background: #2563eb;
            color: #fff;
            border-color: #2563eb;
        }

        button:hover { opacity: 0.88; }

        .help {
            font-size: 0.75rem;
            color: #666;
            line-height: 1.6;
            margin-top: 10px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 4px;
        }

        .help code {
            background: #eee;
            padding: 1px 4px;
            border-radius: 2px;
        }

        .preview-wrap {
            padding: 20px;
            overflow: auto;
        }

        .preview-label {
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 8px;
        }

        /* ===== 印刷プレビュー（A4 横向き） ===== */
        #print-root {
            background: #fff;
            box-shadow: 0 2px 12px rgba(0,0,0,0.12);
            margin: 0 auto;
            width: 297mm;
        }

        @page {
            size: A4 landscape;
            margin: 5mm 5mm;
        }

        .sheet {
            width: 297mm;
            height: 210mm;
            padding: var(--sheet-pad, 6mm) var(--sheet-pad-x, 8mm);
            page-break-after: always;
            font-family: var(--font-print);
            color: #111;
            overflow: hidden;
            line-height: 1;
            /* 間隔はすべてここで一元管理（padding / line-height による微調整は使わない） */
            --sheet-pad: 6mm;
            --sheet-pad-x: 8mm;
            --gap-header-body: 8mm;
            --gap-header-col: 4mm;
            --gap-header-block: 6mm;
            --gap-tier: 5mm;
            --gap-col: 3mm;
            --gap-num-text: 1mm;
            --gap-yomi: 0.9mm;
            --width-yomi-lane: 4mm;
            --height-q-head: 5mm;
        }

        .sheet:last-child {
            page-break-after: auto;
        }

        /* ── ページ全体 ── */
        .sheet-layout {
            display: flex;
            flex-direction: row-reverse;
            align-items: stretch;
            gap: var(--gap-header-body);
            height: 100%;
            width: 100%;
        }

        /* ── 表題エリア：2列（右=表題+名前 / 左=説明） ── */
        .sheet-header {
            flex-shrink: 0;
            height: 100%;
            display: flex;
            flex-direction: row-reverse;
            gap: var(--gap-header-col, 4mm);
            align-items: stretch;
        }

        .header-col {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 右列：表題（上）と名前欄（下）を1縦列に */
        .header-col-title {
            justify-content: space-between;
        }

        .header-col-instruction {
            justify-content: flex-start;
        }

        .header-vtext {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            text-align: center;
        }

        .sheet-title {
            font-size: var(--title-size, 14pt);
            font-weight: bold;
            letter-spacing: 0.12em;
        }

        .sheet-instruction {
            font-size: var(--subtitle-size, 9pt);
            letter-spacing: 0.06em;
        }

        .name-line {
            font-size: var(--name-size, 9pt);
            letter-spacing: 0.18em;
        }

        /* ── 問題エリア：2段 × 各10問 ── */
        .questions-area {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
            height: 100%;
            gap: var(--gap-tier, 5mm);
        }

        .q-tier {
            display: flex;
            flex-direction: row-reverse;
            flex: 1;
            gap: var(--gap-col, 3mm);
            min-height: 0;
            align-items: stretch;
        }

        /* ── 1問：Flex 列（番号 → 本文） ── */
        .q-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--gap-num-text, 1mm);
            height: 100%;
            flex-shrink: 0;
        }

        .q-num {
            font-size: calc(var(--body-size, 9pt) * 0.82);
            font-weight: bold;
            font-family: Arial, sans-serif;
        }

        /* 本文列 + 読み仮名レーン */
        .q-text {
            flex: 1 1 0;
            align-content: start;
            justify-items: center;
        }

        .q-text-inner {
            grid-column: 1;
            grid-row: 1;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: var(--body-size, 9pt);
            letter-spacing: 0.06em;
            text-align: center;
        }

        /* 解答枠 + 読み仮名：ruby / rt */
        .blank-ruby {
            position: relative;
            display: inline-block;
        }

        .blank-ruby .kanji-box {
            display: inline-block;
            width: 1.7em;
            border: var(--box-border);
            background: #fff;
            box-sizing: border-box;
        }

        .blank-ruby.w-1 .kanji-box { height: calc(var(--body-size, 9pt) * 2.2 * var(--box-scale, 1)); }
        .blank-ruby.w-2 .kanji-box { height: calc(var(--body-size, 9pt) * 4.2 * var(--box-scale, 1)); }
        .blank-ruby.w-3 .kanji-box { height: calc(var(--body-size, 9pt) * 6.2 * var(--box-scale, 1)); }
        .blank-ruby.w-4 .kanji-box { height: calc(var(--body-size, 9pt) * 8.2 * var(--box-scale, 1)); }
        .blank-ruby.w-5 .kanji-box { height: calc(var(--body-size, 9pt) * 10.2 * var(--box-scale, 1)); }
        .blank-ruby.w-6 .kanji-box { height: calc(var(--body-size, 9pt) * 12.2 * var(--box-scale, 1)); }

        .blank-ruby rt {
            position: absolute;
            display: flex;
            height: 100%;
            right: -1.1em;
            justify-content: center;
            color: #333;
            font-size: var(--yomi-size, 5pt);
            font-family: var(--font-print);
        }

        .empty-msg {
            writing-mode: horizontal-tb;
            padding: 40px;
            text-align: center;
            color: #999;
        }

        @media print {
            body { background: #fff; }
            .editor { display: block; }
            .sidebar, .preview-label { display: none !important; }
            .preview-wrap {
                padding: 0;
                overflow: visible;
            }
            #print-root {
                box-shadow: none;
                width: auto;
            }
            .sheet {
                width: 297mm;
                height: 210mm;
            }
        }
    </style>
</head>
<body>
    <div class="editor">
        <aside class="sidebar">
            <h1>漢字テスト作成</h1>

            <label for="title">表題</label>
            <input type="text" id="title" value="漢字テスト">

            <label for="subtitle">説明</label>
            <input type="text" id="subtitle" value="線を引いた部分を漢字（漢字と送り仮名）で書きましょう。">

            <div class="row-2">
                <div>
                    <label for="bodySize">本文サイズ (pt)</label>
                    <select id="bodySize"></select>
                </div>
                <div>
                    <label for="titleSize">表題サイズ (pt)</label>
                    <select id="titleSize"></select>
                </div>
            </div>
            <div class="row-2">
                <div>
                    <label for="subtitleSize">説明サイズ (pt)</label>
                    <select id="subtitleSize"></select>
                </div>
                <div>
                    <label for="nameSize">名前欄サイズ (pt)</label>
                    <select id="nameSize"></select>
                </div>
            </div>

            <div class="row-2">
                <div>
                    <label for="yomiSize">読み仮名サイズ (pt)</label>
                    <select id="yomiSize"></select>
                </div>
                <div>
                    <label for="boxScale">入力欄の大きさ (%)</label>
                    <select id="boxScale"></select>
                </div>
            </div>

            <label for="nameFormat">名前欄</label>
            <select id="nameFormat">
                <option value="kanji">年　　組　　名前（　　　　）</option>
                <option value="hiragana">ねん　　くみ　　なまえ（　　　　）</option>
            </select>

            <label for="questions">問題（1行1問）</label>
            <textarea id="questions" spellcheck="false"></textarea>

            <div class="btn-row">
                <button type="button" class="primary" id="btnBuild">作成</button>
                <button type="button" id="btnShuffle">シャッフル</button>
                <button type="button" id="btnPrint">印刷 / PDF</button>
            </div>
            <div class="btn-row">
                <button type="button" id="btnSave">保存</button>
                <button type="button" id="btnLoad">読込</button>
                <input type="file" id="fileLoad" accept=".txt" hidden>
            </div>

            <div class="help">
                <strong>記法</strong><br>
                解答枠：<code>@(よみ,文字数)@</code><br>
                例：<code>@(きもち,2)@</code> → 読み「きもち」の2マス枠<br>
                文字数省略：<code>@(きもち)@</code> → 読みの文字数で自動<br>
                読み省略：<code>@(,2)@</code> または <code>@(2)@</code><br>
                <br>
                1ページ <strong>20問</strong>（10問×2段・A4 横向き）。21問目以降は次ページへ。<br>
                印刷時は倍率 85〜90% で調整できます。<br>
                書体：<strong>UD明朝</strong>（未インストール時は BIZ UDPMincho）
            </div>
        </aside>

        <main class="preview-wrap">
            <p class="preview-label">↓ 印刷プレビュー（A4 横・縦書き）</p>
            <div id="print-root"></div>
        </main>
    </div>

    <script>
        const PER_PAGE = 20;
        const PER_TIER = 10;
        const CIRCLED = ["①","②","③","④","⑤","⑥","⑦","⑧","⑨","⑩",
                         "⑪","⑫","⑬","⑭","⑮","⑯","⑰","⑱","⑲","⑳"];

        const $ = (id) => document.getElementById(id);

        function fillSizeSelect(id, min, max, defaultVal) {
            const sel = $(id);
            sel.innerHTML = "";
            for (let n = min; n <= max; n++) {
                const opt = document.createElement("option");
                opt.value = String(n);
                opt.textContent = String(n);
                if (n === defaultVal) opt.selected = true;
                sel.appendChild(opt);
            }
        }

        fillSizeSelect("bodySize", 6, 49, 18);
        fillSizeSelect("titleSize", 8, 36, 16);
        fillSizeSelect("subtitleSize", 6, 36, 12);
        fillSizeSelect("nameSize", 6, 36, 12);
        fillSizeSelect("yomiSize", 4, 20, 8);

        (function fillBoxScale() {
            const sel = $("boxScale");
            [80, 90, 100, 110, 120, 130, 140, 150, 160, 170, 180].forEach(n => {
                const opt = document.createElement("option");
                opt.value = String(n);
                opt.textContent = String(n);
                if (n === 130) opt.selected = true;
                sel.appendChild(opt);
            });
        })();

        /** 行テキスト → HTML（@(...)@ を解答枠に変換） */
        function parseLine(text) {
            // @(よみ,桁)@ / @(よみ)@ / @(桁)@ / @よみ,桁@ / @よみ@
            const re = /@\(([^)]*)\)@|@([^@]+)@/g;
            return text.replace(re, (_, paren, bare) => {
                const inner = (paren !== undefined ? paren : bare).trim();
                let yomi = "";
                let width = 1;

                if (/^\d+$/.test(inner)) {
                    width = Math.min(parseInt(inner, 10), 6);
                } else if (inner.includes(",")) {
                    const parts = inner.split(",").map(s => s.trim());
                    yomi = parts[0] || "";
                    width = parts[1] ? Math.min(parseInt(parts[1], 10) || 1, 6) : (yomi.length || 1);
                } else if (inner.startsWith(",") || inner === "") {
                    width = 1;
                } else {
                    yomi = inner;
                    width = Math.max(1, Math.min(yomi.length, 6));
                }

                const box = `<span class="kanji-box"></span>`;
                if (yomi) {
                    return `<ruby class="blank-ruby w-${width}">${box}<rt>${escapeHtml(yomi)}</rt></ruby>`;
                }
                return `<span class="blank-ruby w-${width}">${box}</span>`;
            });
        }

        function escapeHtml(s) {
            return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
        }

        function getQuestions() {
            return $("questions").value
                .split(/\r?\n/)
                .map(l => l.trim())
                .filter(Boolean);
        }

        function chunk(arr, size) {
            const out = [];
            for (let i = 0; i < arr.length; i += size) {
                out.push(arr.slice(i, i + size));
            }
            return out;
        }

        function buildQuestionCol(q, num) {
            const col = document.createElement("div");
            col.className = "q-col";
            col.innerHTML =
                `<div class="q-num">${num}</div>` +
                `<div class="q-text"><div class="q-text-inner">${parseLine(q)}</div></div>`;
            return col;
        }

        function buildTier(tierQuestions, tierStartIndex, pageIndex) {
            const tier = document.createElement("div");
            tier.className = "q-tier";
            tierQuestions.forEach((q, i) => {
                const globalIndex = tierStartIndex + i;
                const num = CIRCLED[globalIndex] ?? `${pageIndex * PER_PAGE + globalIndex + 1}`;
                tier.appendChild(buildQuestionCol(q, num));
            });
            return tier;
        }

        function buildSheet(pageQuestions, pageIndex, settings) {
            const sheet = document.createElement("div");
            sheet.className = "sheet";
            sheet.style.setProperty("--body-size", settings.bodySize + "pt");
            sheet.style.setProperty("--title-size", settings.titleSize + "pt");
            sheet.style.setProperty("--subtitle-size", settings.subtitleSize + "pt");
            sheet.style.setProperty("--name-size", settings.nameSize + "pt");
            sheet.style.setProperty("--yomi-size", settings.yomiSize + "pt");
            sheet.style.setProperty("--box-scale", settings.boxScale / 100);
            sheet.style.setProperty("--gap-col", settings.colGap + "mm");
            /* レイアウト間隔（--gap-header-body 等）は .sheet の CSS 変数を参照。JS から上書きしない */

            const layout = document.createElement("div");
            layout.className = "sheet-layout";

            const header = document.createElement("div");
            header.className = "sheet-header";
            /* 右列=表題+名前、左列=説明 */
            header.innerHTML =
                `<div class="header-col header-col-title">` +
                    `<div class="sheet-title header-vtext">${escapeHtml(settings.title)}</div>` +
                    `<div class="name-line header-vtext">${escapeHtml(settings.nameLine)}</div>` +
                `</div>` +
                `<div class="header-col header-col-instruction">` +
                    `<div class="sheet-instruction header-vtext">${escapeHtml(settings.subtitle)}</div>` +
                `</div>`;

            const area = document.createElement("div");
            area.className = "questions-area";

            const tier1 = pageQuestions.slice(0, PER_TIER);
            const tier2 = pageQuestions.slice(PER_TIER, PER_PAGE);

            if (tier1.length) {
                area.appendChild(buildTier(tier1, 0, pageIndex));
            }
            if (tier2.length) {
                area.appendChild(buildTier(tier2, PER_TIER, pageIndex));
            }

            /* flex row-reverse: 表題列=右端、問題=左（上段①–⑩、下段⑪–⑳） */
            layout.appendChild(header);
            layout.appendChild(area);
            sheet.appendChild(layout);
            return sheet;
        }

        function render() {
            const settings = {
                title: $("title").value.trim() || "漢字テスト",
                subtitle: $("subtitle").value.trim(),
                nameLine: $("nameFormat").value === "hiragana"
                    ? "ねん　　くみ　　なまえ（　　　　　　　　　　　　）"
                    : "年　　組　　名前（　　　　　　　　　　）",
                bodySize: parseInt($("bodySize").value, 10),
                titleSize: parseInt($("titleSize").value, 10),
                subtitleSize: parseInt($("subtitleSize").value, 10),
                nameSize: parseInt($("nameSize").value, 10),
                yomiSize: parseInt($("yomiSize").value, 10),
                boxScale: parseInt($("boxScale").value, 10),
                colGap: Math.max(2, Math.min(6, Math.round(52 / PER_TIER * 10) / 10)),
            };

            const questions = getQuestions();
            const root = $("print-root");
            root.innerHTML = "";

            if (questions.length === 0) {
                root.innerHTML = '<div class="empty-msg">問題を入力して「作成」を押してください</div>';
                return;
            }

            const pages = chunk(questions, PER_PAGE);
            pages.forEach((pageQs, pi) => {
                root.appendChild(buildSheet(pageQs, pi, settings));
            });
        }

        function shuffleQuestions() {
            const lines = getQuestions();
            for (let i = lines.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [lines[i], lines[j]] = [lines[j], lines[i]];
            }
            $("questions").value = lines.join("\n");
            render();
        }

        function saveTxt() {
            const blob = new Blob([$("questions").value], { type: "text/plain;charset=utf-8" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "kanji-test-questions.txt";
            a.click();
            URL.revokeObjectURL(a.href);
        }

        $("btnBuild").addEventListener("click", render);
        $("btnShuffle").addEventListener("click", shuffleQuestions);
        $("btnPrint").addEventListener("click", () => window.print());
        $("btnSave").addEventListener("click", saveTxt);
        $("btnLoad").addEventListener("click", () => $("fileLoad").click());
        $("fileLoad").addEventListener("change", (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                $("questions").value = reader.result;
                render();
            };
            reader.readAsText(file, "UTF-8");
            e.target.value = "";
        });

        ["title", "subtitle", "bodySize", "titleSize", "subtitleSize", "nameSize", "yomiSize", "boxScale", "nameFormat"].forEach(id => {
            $(id).addEventListener("change", render);
        });

        render();
    </script>
</body>
</html>
